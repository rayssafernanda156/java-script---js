<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> primeiro contato com java</h2>

   <button onclick="informacao()">clique aqui</button>
     <script>
        function informacao() {

            let nome = prompt("Digite seu nome:");
            alert("Bem-vindo, " + nome + "!");

            let idade = prompt("Digite sua idade:");
            alert("Você tem " + idade + " anos.");

            let curso = prompt("Digite seu curso:");
            alert("Seu curso é " + curso + ".");

            let cidade = prompt("Digite sua cidade:");
            alert("Você mora em " + cidade + ".");

            let hobby = prompt("Digite seu hobby favorito:");
            alert("Seu hobby favorito é " + hobby + ".");

            alert("Cadastro finalizado com sucesso!");
        }
    </script>
</body>
</html>
